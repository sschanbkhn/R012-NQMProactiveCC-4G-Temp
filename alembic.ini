# Alembic config - sinh boi `alembic init -t async` (async template, tuong thich asyncpg).
# Tu: DB_SCHEMA.md Section 9; TASK_LIST.md B1.9

[alembic]
# path to migration scripts.
script_location = %(here)s/alembic

# template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# path_separator; xem alembic docs - dung os.pathsep mac dinh cho project moi.
path_separator = os

# database URL - KHONG dat o day. env.py tu doc DATABASE_URL tu .env va
# override qua config.set_main_option("sqlalchemy.url", ...) - xem env.py.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. Chua dung o v1.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
